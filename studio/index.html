<!--

  two files behind santaclaritaopenhouses.com/1 through /4. Six walls, one system.
  Camera rules, slide shapes, the moving band and the live-data guards all live in the
  engine now; this file is only the argument this monitor makes.

  other one: the URL is on screen whenever the wall is not fullscreen. A monitor
  bookmarked to a real-estate domain while he is talking about AI quietly contradicts
  the pitch. Same reason the marks differ.

  KEEP THIS WALL AND santaclaritaopenhouses.com/2 COMPLEMENTARY, NOT DUPLICATED. That
  one carries the positioning (built here, not a demo, integrations). This one carries
  the PROOF (counts, machines, uptime, the live episode). If both are on screen they
  should read as one argument continuing, never as a mirror.

  ?panel=N offsets the rotation so several monitors never sit on the same slide.
  ?speed=20 seconds per slide (default 16). F toggles fullscreen.
-->
