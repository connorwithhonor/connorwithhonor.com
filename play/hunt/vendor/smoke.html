try {
  const THREE = await import('../three.module.min.js');
  const { GLTFLoader } = await import('./loaders/GLTFLoader.js');
  const { RGBELoader } = await import('./loaders/RGBELoader.js');
  const { MeshoptDecoder } = await import('./libs/meshopt_decoder.module.js');
  const BufferGeometryUtils = await import('./utils/BufferGeometryUtils.js');
  const { EffectComposer } = await import('./postprocessing/EffectComposer.js');
  const { RenderPass } = await import('./postprocessing/RenderPass.js');
  const { ShaderPass } = await import('./postprocessing/ShaderPass.js');
  const { OutputPass } = await import('./postprocessing/OutputPass.js');
  const { GTAOPass } = await import('./postprocessing/GTAOPass.js');
  const { CopyShader } = await import('./shaders/CopyShader.js');
  note('imports ok, three r' + THREE.REVISION);

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
  renderer.setPixelRatio(1);
  renderer.setSize(320, 180, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e4dc);
  const camera = new THREE.PerspectiveCamera(50, 320 / 180, 0.1, 50);
  camera.position.set(2.2, 1.8, 3);
  camera.lookAt(0, 0.4, 0);

  // RGBELoader: parse a 128x64 flat Radiance .hdr built in memory, use it as the environment through PMREM.
  const w = 128, h = 64;
  const head = new TextEncoder().encode('#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y ' + h + ' +X ' + w + '\n');
  const hdr = new Uint8Array(head.length + w * h * 4);
  hdr.set(head);
  for (let i = 0; i < w * h; i++) hdr.set([200, 190, 170, 129], head.length + i * 4);
  const parsed = new RGBELoader().parse(hdr.buffer);
  if (parsed.width !== w || parsed.height !== h) throw new Error('RGBELoader parsed ' + parsed.width + 'x' + parsed.height);
  const envTex = new THREE.DataTexture(parsed.data, parsed.width, parsed.height, THREE.RGBAFormat, parsed.type);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.LinearSRGBColorSpace;
  envTex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  note('RGBELoader ok ' + parsed.width + 'x' + parsed.height);

  // BufferGeometryUtils: merge a floor and a cube into one geometry.
  const floor = new THREE.BoxGeometry(6, 0.1, 6).translate(0, -0.05, 0);
  const cube = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const merged = BufferGeometryUtils.mergeGeometries([floor, cube]);
  if (!merged || merged.attributes.position.count !== 48) throw new Error('mergeGeometries failed');
  scene.add(new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: 0xd8c9b0, roughness: 0.6 })));
  scene.add(new THREE.DirectionalLight(0xffffff, 2));
  note('BufferGeometryUtils ok');

  // GLTFLoader + meshopt + WebP.
  const bin = Uint8Array.from(atob(TEST_GLB), (c) => c.charCodeAt(0));
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const gltf = await loader.parseAsync(bin.buffer, '');
  let glbMesh = null;
  gltf.scene.traverse((o) => { if (o.isMesh) glbMesh = o; });
  if (!glbMesh) throw new Error('GLB has no mesh');
  const vc = glbMesh.geometry.attributes.position.count, img = glbMesh.material.map && glbMesh.material.map.image;
  if (vc !== 81) throw new Error('meshopt decode: expected 81 vertices, got ' + vc);
  if (!img || img.width !== 4) throw new Error('WebP texture did not decode');
  glbMesh.geometry.computeBoundingBox();
  const bb = glbMesh.geometry.boundingBox;
  if (Math.abs(bb.max.x - 0.5) > 0.01 || Math.abs(bb.min.y + 0.5) > 0.01) throw new Error('meshopt decode: wrong bounds');
  gltf.scene.position.set(-1.2, 0.6, 0.8);
  scene.add(gltf.scene);
  note('GLTFLoader ok: meshopt ' + vc + ' verts, webp ' + img.width + 'x' + img.height);

  // EffectComposer: RenderPass + GTAOPass + ShaderPass(Copy) + OutputPass, one frame.
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(1);
  composer.setSize(320, 180);
  composer.addPass(new RenderPass(scene, camera));
  const gtao = new GTAOPass(scene, camera, 320, 180);
  composer.addPass(gtao);
  composer.addPass(new ShaderPass(CopyShader));
  composer.addPass(new OutputPass());
  composer.render();
  const gl = renderer.getContext();
  const glErr = gl.getError();
  if (glErr) throw new Error('WebGL error ' + glErr);
  const px = new Uint8Array(4);
  gl.readPixels(160, 90, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  note('composer frame ok, centre pixel ' + Array.from(px).join(','));
  if (px[0] + px[1] + px[2] === 0) throw new Error('composer rendered black');
  result.textContent = 'OK';
} catch (e) {
  result.textContent = 'ERROR: ' + (e && e.message ? e.message : e);
  note(e && e.stack ? e.stack : String(e));
}
