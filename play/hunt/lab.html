sun.castShadow = true; sun.shadow.mapSize.set(CFG.shadow, CFG.shadow); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 8, bottom: -8, near: 1, far: 60 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
sun.shadow.radius = TIER === 'desktop' ? 3.5 : 2;        // a few centimetres of soft edge on the sun patch
scene.add(sun, sun.target);
const skyMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0xbcd3ea, fog: false, depthWrite: false });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), skyMat); skyDome.frustumCulled = false; scene.add(skyDome);
skyDome.position.y = -70;                               // sink the dome so the windows frame blue sky and cloud, not horizon haze (the light still comes from the true HDRI)
let skyEnv = null, probeRT = null, roomEnv = null, flatLight = null;
const cubeRT = new THREE.WebGLCubeRenderTarget(LITE ? 128 : 256, { type: THREE.HalfFloatType }), cubeCam = new THREE.CubeCamera(.1, 400, cubeRT);
function aimSun(dir) { SUN_DIR.copy(dir).normalize(); sun.target.position.set(W / 2, 1, D / 2); sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 30); sun.target.updateMatrixWorld(); }
/** Sky light with the sun taken out: either the clamped HDRI, or a painted gradient if the HDRI did not arrive. */
function gradientSky() { const c = document.createElement('canvas'); c.width = 8; c.height = 256; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#5f93cf'); g.addColorStop(.45, '#a9c9e8'); g.addColorStop(.5, '#dde7ee'); g.addColorStop(1, '#cfd4d2'); x.fillStyle = g; x.fillRect(0, 0, 8, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
function fallbackEnv() { const s = new THREE.Scene(), t = gradientSky(); s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 12), new THREE.MeshBasicMaterial({ side: THREE.BackSide, map: t, color: new THREE.Color(1.6, 1.6, 1.6) }))); skyEnv = pmrem.fromScene(s, .04).texture; if (!skyMat.map) { skyMat.map = t; skyMat.color.set(0xffffff); skyMat.needsUpdate = true; } }
function loadSky(RGBELoader) {
  const hdr = ENVDEF ? ENVDEF.hdr.file : 'env/kloofendal_48d_partly_cloudy_puresky_512.hdr', L = (ENVDEF && ENVDEF.lighting) || {};
  const jpg = ENVDEF ? ((LITE && ENVDEF.skyPhone) || ENVDEF.sky).file : 'env/kloofendal_48d_partly_cloudy_puresky_sky_2k.jpg';
  if (L.sun && L.sun.direction) aimSun(new THREE.Vector3(...L.sun.direction)); else aimSun(SUN_DIR);
  const clamp = L.clampRadiance || 30;
  // Half float, which is what RGBELoader gives by default: every WebGL2 phone can filter it. (32-bit float needs OES_texture_float_linear, which iPhones lack, and fails silently to black.)
  if (RGBELoader && FLOAT_RT) new RGBELoader(manager).setDataType(THREE.HalfFloatType).load(ASSETS + hdr, (t) => {
    const d = t.image.data, cap = THREE.DataUtils.toHalfFloat(clamp); for (let i = 0; i < d.length; i++) if (d[i] > cap) d[i] = cap;       // take the sun disc out: the DirectionalLight is the sun. Positive half floats sort like integers, so this compares the raw bits.
    t.mapping = THREE.EquirectangularReflectionMapping; t.needsUpdate = true; skyEnv = pmrem.fromEquirectangular(t).texture; t.dispose(); late();
  }, undefined, () => { warn('HDRI missing, using a painted sky'); fallbackEnv(); late(); });
  else if (FLOAT_RT) fallbackEnv();
  // the visible sky: the 2k tonemapped JPG of the same HDRI, on a dome, mapped the way three.js maps an equirect
  texLoader.load(ASSETS + jpg, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.anisotropy = ANISO; skyMat.map = t; skyMat.needsUpdate = true; late(); }, undefined, () => { if (!skyMat.map) { skyMat.map = gradientSky(); skyMat.needsUpdate = true; } });
}
const setEnv = (set, tex, k) => { for (const m of set) { if (m.envMap !== tex) { m.envMap = tex; m.needsUpdate = true; } m.envMapIntensity = k * (m.userData.fill || 1); } };
/** Redo the light. Outdoors takes the sky. Indoors takes a probe of the room itself: first lit only by the sun and what the windows show,
    then again with that result as its own fill, so light bounces off the floor and walls the way it does in a real room. */
function safeRelight() { try { relight(); } catch (e) { warn('room probe failed, using the sky', e.message); CFG.probe = 0; try { relight(); } catch (e2) { warn(e2.message); } } }
function relight() {
  setRoomLight(); flushDecals(); renderer.shadowMap.needsUpdate = true; dirty = 3;
  skyMat.color.setScalar(skyMat.map ? CFG.sky : .7); for (const m of cardMats) m.color.setScalar(CFG.card);
  if (!FLOAT_RT) { if (!flatLight) { flatLight = new THREE.HemisphereLight(0xf3f6ff, 0xcdbba2, 1.5); scene.add(flatLight); } return; }     // no float render targets: no environment maps at all, a plain sky-and-floor light instead
  if (!skyEnv) fallbackEnv();
  scene.environment = skyEnv; setEnv(EXT, skyEnv, CFG.ext);
  if (CFG.probe > 0) {
    const tm = renderer.toneMapping; renderer.toneMapping = THREE.NoToneMapping; skyMat.color.setScalar(1); for (const m of cardMats) m.color.setScalar(CFG.card * 1.6); setEnv(INT, skyEnv, 0); cubeCam.position.copy(PROBE);
    for (let i = 0; i < CFG.probe; i++) { cubeCam.update(renderer, scene); const rt = pmrem.fromCubemap(cubeRT.texture); setEnv(INT, rt.texture, 1); if (probeRT) probeRT.dispose(); probeRT = rt; }
    setEnv(INT, probeRT.texture, CFG.fill); renderer.toneMapping = tm;
  } else {                                           // lowest tier, or no float render targets: a painted stand-in room, bright on the window sides, warm underfoot
    if (!roomEnv) { const s = new THREE.Scene(), face = (c, k, px, py, pz, rx, ry, w, h) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(px, py, pz); m.rotation.set(rx, ry, 0); s.add(m); };
      face(0xf2efe8, .16, 0, 1.35, 0, Math.PI / 2, 0, 9, 7); face(0x9b8063, .2, 0, -1.35, 0, Math.PI / 2, 0, 9, 7); face(0xf2efe8, .14, -4.5, 0, 0, 0, Math.PI / 2, 7, 2.7); face(0xf2efe8, .14, 0, 0, -3.5, 0, 0, 9, 2.7);
      face(0xf2efe8, .1, 4.5, 0, 0, 0, Math.PI / 2, 7, 2.7); face(0xf2efe8, .1, 0, 0, 3.5, 0, 0, 9, 2.7); face(0xdfeaff, 1.1, 4.45, -.15, -.2, 0, Math.PI / 2, 4, 2.4); face(0xdfeaff, 1.1, 2, .1, 3.45, 0, 0, 3.3, 1.95);
      roomEnv = pmrem.fromScene(s, .03).texture; }
    setEnv(INT, roomEnv, CFG.fill * .5);
  }
  skyMat.color.setScalar(skyMat.map ? CFG.sky : .7); for (const m of cardMats) m.color.setScalar(CFG.card); for (const a of artMeshes) a.material.envMapIntensity = CFG.fill * .9;
}

/* ---------- ambient occlusion: RenderPass, GTAOPass, OutputPass. One flag turns the whole chain off. ---------- */
let composer = null, gtao = null, fxaa = null;
async function buildEffects() {
  const [ec, rp, gp, op, sp, fs] = await Promise.all(['postprocessing/EffectComposer', 'postprocessing/RenderPass', 'postprocessing/GTAOPass', 'postprocessing/OutputPass', 'postprocessing/ShaderPass', 'shaders/FXAAShader'].map((n) => tryImport('./vendor/' + n + '.js')));
  if (!ec || !rp || !gp || !op) { CFG.fx = false; return; }
  try {
    const s = renderer.getDrawingBufferSize(new THREE.Vector2());
    composer = new ec.EffectComposer(renderer, new THREE.WebGLRenderTarget(s.x, s.y, { type: THREE.HalfFloatType, samples: num('msaa', 4) }));
    composer.addPass(new rp.RenderPass(scene, camera));
    gtao = new gp.GTAOPass(scene, camera, s.x, s.y);
    gtao.updateGtaoMaterial({ radius: num('aor', .35), distanceExponent: num('aoe', 1.5), thickness: num('aot', 1), scale: num('aos', 1.2), samples: num('aon', 16), distanceFallOff: 1, screenSpaceRadius: false });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: num('pdd', 2), normalPhi: num('pdn', 3), radius: num('pdr', 6), radiusExponent: 1, rings: num('pdg', 2), samples: num('pds', 16) });
    // The denoised occlusion is still grainy and ragged along silhouettes at one sample per pixel, and no temporal pass follows to hide it. Average it over a few pixels as it is
    // multiplied in: the colour picture stays sharp, the shading goes smooth. (Occlusion only: the colour buffer is never blurred.)
    if (Q.get('aoblur') !== '0') { const bm = gtao.blendMaterial, t = gtao.pdRenderTarget.texture; t.minFilter = t.magFilter = THREE.LinearFilter; bm.uniforms.px = { value: new THREE.Vector2(1 / s.x, 1 / s.y) };
      bm.fragmentShader = 'uniform float intensity; uniform sampler2D tDiffuse; uniform vec2 px; varying vec2 vUv; void main() { vec3 a = vec3( 0.0 ); for ( int i = -2; i <= 2; i ++ ) for ( int j = -2; j <= 2; j ++ ) a += texture2D( tDiffuse, vUv + vec2( float( i ), float( j ) ) * px * 1.5 ).rgb; gl_FragColor = vec4( mix( vec3( 1.0 ), a / 25.0, intensity ), 1.0 ); }'; bm.needsUpdate = true; }
    gtao.blendIntensity = num('ao', .9); if (Q.get('aoview')) { gtao.output = gp.GTAOPass.OUTPUT.Denoise; renderer.toneMapping = THREE.NoToneMapping; }
    // glass must not count as a solid when occlusion is measured
    const hide = gtao.overrideVisibility.bind(gtao); gtao.overrideVisibility = function () { hide(); scene.traverse((o) => { if (o.userData.noAO || o === skyDome) o.visible = false; }); };
    composer.addPass(gtao); composer.addPass(new op.OutputPass());
    // The multisampled target is resolved before tone mapping, so a black window frame against bright sky still stair-steps. FXAA on the finished picture cleans those edges.
    if (sp && fs && Q.get('fxaa') !== '0') { fxaa = new sp.ShaderPass(fs.FXAAShader); fxaa.material.uniforms.resolution.value.set(1 / s.x, 1 / s.y); composer.addPass(fxaa); }
  } catch (e) { warn('effects off', e.message); composer = null; CFG.fx = false; }
}

/* ---------- camera: a slow walk around the middle of the room at eye height, or four fixed listing angles ---------- */
const VIEWS = [null,
  { p: [1.45, 1.5, .85], t: [6.3, .95, 4.7], fov: 52 },      // 1 from the kitchen corner across the island to the seating and the sliders
  { p: [8.25, 1.5, 6.1], t: [2.0, .95, 2.3], fov: 52 },       // 2 from the window corner back to the kitchen
  { p: [4.3, 1.3, 1.1], t: [7.0, .7, 4.0], fov: 50 },      // 3 the seating group in the sun
  { p: [4.85, 1.42, 5.6], t: [.55, 1.02, 3.75], fov: 48 }];   // 4 the kitchen: island, stools, pendants, joinery
let view = CFG.view, t0 = performance.now();
function setView(n) { view = n; dirty = 3; document.querySelectorAll('#hud button[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === n))); }
function aim(time) {
  const v = VIEWS[view];
  if (v) { camera.position.set(...v.p); camera.fov = v.fov; camera.lookAt(...v.t); }
  else { const a = (time - t0) / 1000 * (Math.PI * 2 / 150) + 3.6 + num('phase', 0) * Math.PI * 2, cx = 4.9, cz = 3.3; camera.position.set(cx + Math.cos(a) * 1.25, 1.55, cz + Math.sin(a) * .95); camera.fov = innerWidth < innerHeight ? 68 : 54; camera.lookAt(cx - Math.cos(a) * 2.6, 1.15, cz - Math.sin(a) * 2.2); }
  camera.updateProjectionMatrix();
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; if (composer) { composer.setPixelRatio(CFG.pr); composer.setSize(w, h); const s = renderer.getDrawingBufferSize(new THREE.Vector2()); if (fxaa) fxaa.material.uniforms.resolution.value.set(1 / s.x, 1 / s.y); if (gtao && gtao.blendMaterial.uniforms.px) gtao.blendMaterial.uniforms.px.value.set(1 / s.x, 1 / s.y); } dirty = 3; }
addEventListener('resize', resize);
function frame(time) {
  requestAnimationFrame(frame);
  if (!ready || (view && dirty <= 0)) return;        // a fixed view only redraws when something changed
  dirty--; aim(time);
  if (CFG.fx && composer) composer.render(); else renderer.render(scene, camera);
  if (!window.__labReady && dirty <= 0) window.__labReady = true;
  if (!view) dirty = 1;
}

/* ---------- start ---------- */
(async function start() {
  const say = (s) => { $('msg').textContent = s; };
  const [materials, models, gl, mo, rg] = await Promise.all([getJSON(ASSETS + 'materials.json'), getJSON(ASSETS + 'models.json'), tryImport('./vendor/loaders/GLTFLoader.js'), tryImport('./vendor/libs/meshopt_decoder.module.js'), FLOAT_RT ? tryImport('./vendor/loaders/RGBELoader.js') : null]);
  useManifest(materials);
  let tris = 0; try { tris = buildRoom(); } catch (e) { console.error(e); }
  loadSky(rg && rg.RGBELoader); loadCards(materials);
  loadModels(gl && gl.GLTFLoader, mo && mo.MeshoptDecoder, models);
  if (CFG.fx) await buildEffects();
  say('Bringing in the furniture');
  // The room is complete in flat colour already. Give the assets a few seconds so a fast connection never sees them pop in, then start regardless:
  // whatever is still on its way is added as it lands (late()), so a slow or stalled connection never holds the first frame.
  let all = false; settled.then(() => { all = true; });
  await Promise.race([settled, sleep(CFG.waitMs)]);
  say('Letting the daylight in');
  await sleep(30);
  resize(); aim(performance.now());
  safeRelight();
  ready = true; started = performance.now(); t0 = started; dirty = 3;
  window.__labStart = { ms: Math.round(started), everythingHadArrived: all };            // for the test harness: when the first frame was allowed, and whether it had to go without some assets
  $('load').classList.add('done'); $('hud').classList.remove('hide'); $('fxb').setAttribute('aria-pressed', String(!!(CFG.fx && composer)));
  window.__lab = { CFG, scene, camera, renderer, setView, relight, tris, cam(c) { VIEWS[5] = { p: c.slice(0, 3), t: c.slice(3, 6), fov: c[6] || 50 }; setView(5); }, set(o) { Object.assign(CFG, o); renderer.toneMappingExposure = CFG.exposure; sun.intensity = CFG.sun; relight(); }, info: () => ({ tris, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, textures: renderer.info.memory.textures, fx: !!(CFG.fx && composer) }) };
  requestAnimationFrame(frame);
  await settled;                                     // every file has arrived, failed or timed out: one last pass over the light, then tell the test harness
  if (!all) await sleep(450);
  clearTimeout(relightTimer); safeRelight(); await sleep(60); window.__labSettled = true;
})();
document.querySelectorAll('#hud button[data-v]').forEach((b) => b.addEventListener('click', () => setView(+b.dataset.v)));
$('fxb').addEventListener('click', async () => { if (!composer) { CFG.fx = true; await buildEffects(); resize(); } else CFG.fx = !CFG.fx; $('fxb').setAttribute('aria-pressed', String(!!(CFG.fx && composer))); dirty = 3; });
addEventListener('keydown', (e) => { if (e.key >= '0' && e.key <= '4') setView(+e.key); if (e.key === 'h') $('hud').classList.toggle('hide'); });
if (view) setView(view);
</script>
