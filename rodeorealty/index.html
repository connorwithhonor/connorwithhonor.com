res the authorization you set and the platform rules. Tool and agent terminology varies among vendors. Connected access is not permission to use every possible action. An assistant with a calendar can make a scheduling error. One with payment or account administration access can do more damage. Ask: Which tools would you let an assistant use today? Explain that the label agent does not establish reliability.", "takeaway": "Access determines what a mistake can touch.", "bullets": ["Model: generates an answer", "Tool: does a specific operation", "Agent: chooses and carries out steps"], "section": "The opportunity", "eyebrow": "The opportunity · 3 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Confidence can fool us", "minutes": 2, "notes": "Show a fictional bad claim: This property has a permitted ADU. Ask what establishes that. The listing copy alone does not establish permit status. Check authoritative records and appropriate professionals. Never let an AI invent an amenity, legal status or source. Source: NIST AI 600-1, https://nvlpubs.nist.gov/nistpubs/AI/NIST.AI.600-1.pdf .", "takeaway": "Evidence belongs beside the claim.", "bullets": ["A polished answer can contain a false fact.", "A correct answer can use stale information.", "A safe demo can fail in a real workflow."], "section": "The opportunity", "eyebrow": "The opportunity · 2 min", "sources": [{"title": "NIST · Generative AI Risk Profile", "url": "https://nvlpubs.nist.gov/nistpubs/AI/NIST.AI.600-1.pdf"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "The penny that doubles", "minutes": 3, "notes": "Ask the audience to guess day 30 before revealing it. Say: That penny just bought itself a very different neighborhood. Day n equals $0.01 × 2^(n−1). The cumulative payment across days 1–30 equals $10,737,418.23. Distinguish the day-30 amount from the sum. This arithmetic explains compounding. It does not establish that AI intelligence, adoption, revenue or useful reliability doubles on that schedule. There is no universal verified intelligence doubling clock.", "takeaway": "Compounding is the illustration. A universal AI doubling clock is not established.", "bullets": [], "section": "The opportunity", "eyebrow": "The opportunity · 3 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk", "interactive": "penny"}, {"title": "What the benchmark measures", "minutes": 2, "notes": "METR (MET-er) measures the human task duration corresponding to a model's probability of successful completion on selected tasks. The widely cited horizon uses 50% success. That is not 50% of all jobs, universal intelligence, or reliable autonomous operation in real estate. Software tasks do not automatically predict negotiation or compliance performance. Avoid a fixed doubling prediction on stage.", "takeaway": "A benchmark is a measurement with boundaries.", "bullets": ["METR measures task time horizons.", "Tasks and success thresholds matter.", "Your workflow still needs its own test."], "section": "The opportunity", "eyebrow": "Measurement, not destiny · 2 min", "sources": [{"title": "METR · Research assessment", "url": "https://metr.org/blog/2026-01-29-time-horizon-1-1/"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "AI is helping build AI", "minutes": 2, "notes": "Recursive (ree-KUR-siv) self-improvement means a system contributes to improving its own capabilities. METR's November 5 assessment discusses faster progress at Anthropic on well-specified tasks, with uncertainty, other contributors and redactions. This does not prove an uncontrollable loop or predict weekly or hourly major releases. Mark this as November 11 research and update before the event. Investor case: faster useful research and lower development costs. Critic case: unreliable measurements, concentrated control and harder oversight. Neither motive establishes whether the claim is true. Ask for independent evaluation and practical outcomes.", "takeaway": "Research: METR, November 5, 2026", "bullets": ["Research assistance is real.", "Fully autonomous self-improvement is a larger claim.", "The pace remains uncertain."], "section": "The opportunity", "eyebrow": "Evidence + forecasts · Research checked Nov 11 · 2 min", "sources": [{"title": "METR · Research assessment", "url": "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "The paperclip problem", "minutes": 2, "notes": "Explain the paperclip thought experiment as philosophy, not a reported incident. Say: Tell a system to maximize appointments, and you had better explain that fake appointments do not count. Real failures can come from bad instructions, faulty data, software errors, malicious inputs and misplaced trust. They do not require a malicious human or conscious machine. In your business, define the goal, boundaries, approval points and stop condition.", "takeaway": "A thought experiment about objectives.", "bullets": ["A narrow goal", "Broad powers", "Missing constraints"], "section": "The opportunity", "eyebrow": "A thought experiment · 2 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "One listing, several useful drafts", "minutes": 3, "notes": "Demonstration, 3 minutes. Use fictional 3-bedroom, 2-bath home with a covered patio. Deliberately omit square footage, school claims and permit claims. Prompt: Using only these approved facts, draft a 90-word description, 2 social captions and a 30-second script. List missing facts. Do not invent features or make protected-class preferences. Do not publish. Ask the room to catch any unsupported claims. If live AI fails, read the prompt and use prechecked sample drafts. Benefits are workflow hypotheses until measured. Use only material you have rights to process and publish.", "takeaway": "Fictional example. No client data required.", "bullets": ["Approved listing facts and licensed media", "Description, captions and a short script", "Agent review before publication"], "section": "Useful work, with boundaries", "eyebrow": "Fictional property · Live exercise · 3 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "The approval line", "minutes": 3, "notes": "Give the assistant read-only access where it is enough. Separate draft approval from sending approval. Check recipients, amounts, attachments and scheduling. Keep logs and a way to pause work. Treat content in an email, page or document as information, not automatically as a command for your agent. Never give a new tool broad account access just because a demo looked good. This is recommended operational design, not a promise that any vendor enforces it.", "takeaway": "A smaller permission set limits the damage.", "bullets": ["Drafts: low risk, easy to review", "Messages and posts: review facts and recipients", "Money, contracts and access: explicit control"], "section": "Useful work, with boundaries", "eyebrow": "Useful work, with boundaries · 3 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Client data and MLS rights", "minutes": 3, "notes": "Check your broker's rules, MLS agreement, image licenses and vendor privacy terms before uploading or reusing data. Remove unnecessary identifiers and financial information. Redaction can miss details, so review the result. California DRE emphasizes continuing licensee responsibility and protection of customer information. No blanket legal assurance. Ask: What would you refuse to paste into a general chatbot? A chat can leave records in logs, backups or connected apps. Deletion and retention depend on the product and contract. Do not claim everything is permanently public, or that delete guarantees every copy disappears. Check actual terms and settings before client use.", "takeaway": "Publicly visible does not mean freely reusable.", "bullets": ["Approved systems and permitted uses", "Minimum necessary information", "Retention, deletion and reuse policies"], "section": "Useful work, with boundaries", "eyebrow": "Useful work, with boundaries · 3 min", "sources": [{"title": "California DRE · AI advisory", "url": "https://www.dre.ca.gov/Licensees/Advisories/Advisory_2026_03_17_AI_in_California_Real_Estate.html"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Digitally altered property images", "minutes": 3, "notes": "California's 2026 requirements and CRMLS rules govern digitally altered property images. Review the exact rule for the image and publishing channel. CRMLS guidance calls for the original next to the altered image and clear description labeling, and forbids certain misleading alterations even when labeled. Examples include removing defects or adding landscaping not included in the sale. Do not treat a disclosure as permission to misrepresent a home. Sources: https://kb.crmls.org/knowledgebase/digitally-altered-image-guidance-faqs/ ; https://www.dre.ca.gov/Licensees/Advisories/Advisory_2026_03_17_AI_in_California_Real_Estate.html . Update before event. Minor adjustments such as brightness or cropping are treated differently when they do not misrepresent the property. Check the exact rule rather than assuming every use of an AI photo tool has the same disclosure duty.", "takeaway": "California law and MLS rules both matter.", "bullets": ["Altered image and original", "Clear label", "No invented property features"], "section": "Useful work, with boundaries", "eyebrow": "Useful work, with boundaries · 3 min", "sources": [{"title": "CRMLS · Digitally altered image guidance", "url": "https://kb.crmls.org/knowledgebase/digitally-altered-image-guidance-faqs/"}, {"title": "California DRE · AI advisory", "url": "https://www.dre.ca.gov/Licensees/Advisories/Advisory_2026_03_17_AI_in_California_Real_Estate.html"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "A familiar voice can be fake", "minutes": 2, "notes": "Say: My cop view is simple. The story can sound good and still need checking. AI can make impersonation easier, but ordinary email compromise remains dangerous too. Use independent verification for consequential requests. A shared family word may add a layer, but it is not a substitute for callback and transaction controls. Source: FBI IC3, https://www.ic3.gov/PSA/2024/PSA241203 . Do not demonstrate cloning any real person's voice without consent.", "takeaway": "Recognition alone cannot verify identity.", "bullets": ["Voice cloning", "Convincing messages", "Urgency and secrecy"], "section": "Fraud: pause and verify", "eyebrow": "Fraud: pause and verify · 2 min", "sources": [{"title": "FBI IC3 · AI-enabled fraud", "url": "https://www.ic3.gov/PSA/2024/PSA241203"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Wire instructions: stop and verify", "minutes": 3, "notes": "Scenario: An email appears during escrow with new wiring instructions. Ask what everyone does. Answer: Stop. Call a verified number from independently established records, not the new email, attached form or caller ID. Confirm using your escrow/bank's approved process. Never let an AI independently approve, change or execute wire instructions. Use 2-person review where your process supports it. Sources: https://www.nar.realtor/the-facts/consumer-guide-how-to-protect-against-real-estate-wire-fraud ; https://www.ic3.gov/PSA/2024/PSA241203 . Discuss without identifying any office incident or victim.", "takeaway": "The suspicious message cannot supply its own proof.", "bullets": ["Use a number you independently know.", "Confirm with the authorized party.", "Treat changed instructions as a warning."], "section": "Fraud: pause and verify", "eyebrow": "Fictional escrow scenario · 3 min", "sources": [{"title": "NAR · Real estate wire-fraud guide", "url": "https://www.nar.realtor/the-facts/consumer-guide-how-to-protect-against-real-estate-wire-fraud"}, {"title": "FBI IC3 · AI-enabled fraud", "url": "https://www.ic3.gov/PSA/2024/PSA241203"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "If money has already moved", "minutes": 2, "notes": "Call the bank's fraud team using a trusted number immediately. Ask it to contact the receiving institution and attempt recovery. Follow law enforcement and organizational incident procedures, including an IC3 report in the United States. Preserve messages, headers, transaction details and timing. Notify broker and appropriate professionals. Do not wait for an AI diagnosis or send additional money to a recovery service that contacts you. Source: NAR wire-fraud guide and FBI IC3 above. Source links in preceding notes apply.", "takeaway": "Speed matters. Recovery is not guaranteed.", "bullets": ["Contact the sending bank immediately.", "Request recall or reversal assistance.", "Report promptly and preserve evidence."], "section": "Fraud: pause and verify", "eyebrow": "Fraud: pause and verify · 2 min", "sources": [{"title": "NAR · Real estate wire-fraud guide", "url": "https://www.nar.realtor/the-facts/consumer-guide-how-to-protect-against-real-estate-wire-fraud"}, {"title": "FBI IC3 · AI-enabled fraud", "url": "https://www.ic3.gov/PSA/2024/PSA241203"}], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Voice makes the request easier", "minutes": 2, "notes": "Use a short fictional demonstration. Speak normally, then inspect what the system heard. Names, prices and addresses can be misheard. Have it repeat critical details in text before acting. Human language comprehension varies by material, familiarity and listener. Do not claim a universal 150–200 word-per-minute ceiling. Voice is an available interface. Brain interfaces for routine real estate work belong in a speculative future discussion, not today's setup instructions.", "takeaway": "Speaking a command does not remove review.", "bullets": ["“Prepare tomorrow's follow-up drafts.”", "“Show me missing listing information.”", "“Ask before anything leaves the system.”"], "section": "Your next useful move", "eyebrow": "Your next useful move · 2 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "The 30-day business test", "minutes": 3, "notes": "Week 1: Choose a low-risk job and record your current time and error rate. Week 2: Test fictional and approved historical examples. Week 3: Use it on a small approved live set with human review. Week 4: Compare results, cost, corrections and follow-up quality. Ask whether saved time actually turned into calls or appointments. Do not promise income, replacement-proof careers or a guaranteed percentage of time saved. More content alone is not a business result. Keep disclosures and fair housing review in the process. Additional examples to choose from: buyer showing plan based on stated needs, checked against actual listings without demographic steering; broker policy assistant that cites approved policies and escalates exceptions; consented intake used for a call-preparation brief; a small business missed-inquiry workflow with a limited pilot and clear operating costs. Price any service from its actual scope and ongoing review needs, not a promise of effortless revenue.", "takeaway": "Measure whether the extra time creates value.", "bullets": ["1 repeatable workflow", "Time saved and errors caught", "Qualified conversations and appointments"], "section": "Your next useful move", "eyebrow": "Business experiment, not an income promise · 3 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "A hopeful plan under uncertainty", "minutes": 2, "notes": "Hold the competing views to the same evidence standard. This is not a requirement to give unsupported claims equal weight. Ask who benefits, who is exposed and what safeguards change the outcome. Shared model updates are engineered processes, not instant sharing of every AI experience. No universal agent job-loss percentage is established here. A practical response is to learn 1 workflow, protect clients and measure results. Human incentives can shape deployment, but errors can also arise without a malicious operator. Close with agency rather than helplessness.", "takeaway": "You can act without buying every prediction.", "bullets": ["Investors see new capacity and lower costs.", "Critics ask who bears the risk.", "Agents can test useful work and keep control."], "section": "Your next useful move", "eyebrow": "Competing views · Same evidence standard · 2 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Your next useful move", "minutes": 2, "notes": "Close: You do not have to buy every shiny thing on the table. Pick 1 job you repeat, test it, and keep the keys where you can reach them. Invite agents to describe a workflow they want to evaluate. Do not imply a sales guarantee or add a paid commitment. The presentation is available at https://connorwithhonor.com/rodeorealty/ .", "takeaway": "ConnorWithHonor.com/rodeorealty · 661-400-1720", "bullets": ["Choose 1 task.", "Name the facts that must be checked.", "Decide who can approve the result."], "section": "Your next useful move", "eyebrow": "Your next useful move · 2 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}, {"title": "Questions and a practical challenge", "minutes": 10, "notes": "Reserve 10 minutes. Take 2–3 concrete workflows. For each, identify allowed inputs, intended output, approval gate and a way to measure value. If asked about law, current pricing or a product capability you cannot verify, say you will check rather than improvise. Sources and research date appear in these speaker notes throughout. Presenter refresh checklist: verify current DRE/CRMLS guidance, update model examples, test demo, check current links and timing before December 15. Total scheduled session: 60 minutes.", "takeaway": "10 minutes of discussion", "bullets": ["What would you try first?", "Where would you keep human approval?", "What evidence would change your mind?"], "section": "Your next useful move", "eyebrow": "Discussion · 10 min", "sources": [], "citation_hint": "Notes & sources · Prepared Nov 11, 2026 · Refresh before the talk"}]</script>
<script>
'use strict';
const raw=JSON.parse(document.getElementById('slideData').textContent);
const slides=Array.isArray(raw)?raw:raw.slides;
const $=id=>document.getElementById(id),deck=$('deck'),dialog=$('dialog');
let index=0,lastFocus=null,toastTimer;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bullets(points){return '<ul class="points">'+points.map(p=>'<li>'+esc(typeof p==='object'?(p.text||p.label||JSON.stringify(p)):p)+'</li>').join('')+'</ul>'}
function title(s){return s.title||s.heading||''}
function render(s,n){const points=s.bullets||s.points||[];const type=s.layout||s.type||'';const content=s.body||s.content||'';let body='';
 if(s.columns){body='<div class="two-col">'+s.columns.map(c=>'<div class="column"><h3>'+esc(c.title||c.heading)+'</h3>'+(c.bullets?bullets(c.bullets):'<p>'+esc(c.text||c.body)+'</p>')+'</div>').join('')+'</div>'}
 else if(s.timeline){body='<div class="timeline">'+s.timeline.map(t=>'<div class="milestone"><div class="year">'+esc(t.year)+'</div><p>'+esc(t.text||t.label)+'</p></div>').join('')+'</div>'}
 else{if(points.length)body+=bullets(points);if(content)body+='<p class="subtitle">'+esc(Array.isArray(content)?content.join('\n'):content)+'</p>'}
 if(s.interactive==='penny'){body='<div class="penny"><div><div class="penny-label">ON DAY <span id="dayNumber">1</span></div><div class="penny-value" id="dayValue">$0.01</div><div class="range-row"><input id="pennyDay" type="range" min="1" max="30" value="1" aria-label="Day in doubling example"><button id="resetPenny">Day 1</button></div><small>Day 1 = $0.01. Each day is twice the previous day.</small></div><div><div class="bar-chart" id="bars" aria-hidden="true">'+Array.from({length:30},(_,i)=>'<i style="height:'+Math.max(.7,100*Math.pow(2,i-29))+'%"></i>').join('')+'</div><div class="penny-summary">Total through day <span id="sumDay">1</span>:<br><strong id="sumValue">$0.01</strong></div><small>A mathematical illustration, not a measured rate of AI progress.</small></div></div>'}
 const first=n===0;return '<section class="slide '+(first?'title-slide':'')+'" data-number="'+String(n+1).padStart(2,'0')+'" aria-label="Slide '+(n+1)+': '+esc(title(s))+'" aria-hidden="true"><div class="eyebrow">'+esc(s.eyebrow||s.section||(first?'Rodeo Realty · One-hour conversation':'AI, with you in control'))+'</div><'+(first?'h1':'h2')+'>'+esc(title(s))+'</'+(first?'h1':'h2')+'>'+(s.subtitle?'<p class="subtitle">'+esc(s.subtitle)+'</p>':'')+'<div class="body">'+body+'</div>'+(s.takeaway?'<p class="takeaway">'+esc(s.takeaway)+'</p>':'')+(s.kicker?'<p class="kicker">'+esc(s.kicker)+'</p>':'')+(first?'<div class="title-line">Connor MacIvor · CalDRE #01238257 · SYNC Brokerage</div>':'')+'<div class="citation-hint">'+esc(s.citation_hint||'Speaker notes, source links and review context: Notes & sources')+'</div></section>'}
deck.innerHTML=slides.map(render).join('');
const sections=[...deck.querySelectorAll('.slide')];
function hashIndex(){const m=location.hash.match(/^#s(\d+)$/);return m?Number(m[1])-1:0}
function show(n,historyMode='push'){index=Math.max(0,Math.min(slides.length-1,n));sections.forEach((s,k)=>{s.classList.toggle('active',k===index);s.setAttribute('aria-hidden',k!==index);s.inert=k!==index});$('count').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;$('previous').disabled=index===0;$('next').disabled=index===slides.length-1;$('progress').style.width=((index+1)/slides.length*100)+'%';document.title=title(slides[index])+' · Rodeo Realty';if(historyMode!=='none'&&location.hash!=='#s'+(index+1))history[historyMode==='replace'?'replaceState':'pushState'](null,'','#s'+(index+1));window.scrollTo(0,0)}
function move(delta){show(index+delta)}
function openDialog(label,html){lastFocus=document.activeElement;$('dialogTitle').textContent=label;$('dialogBody').innerHTML=html;dialog.showModal();$('closeDialog').focus()}
function closeDialog(){dialog.close();if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function sourceList(s){const items=s.sources||s.citations||[];return items.length?'<ol class="source-list">'+items.map(v=>{const o=typeof v==='string'?{url:v,title:v}:v;const href=o.url||o.href||'';return '<li>'+(/^https?:\/\//.test(href)?'<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(o.title||o.label||href)+'</a>':esc(o.title||o.label||o.text||v))+(o.note?'<br>'+esc(o.note):'')+'</li>'}).join('')+'</ol>':'<p>No external factual source is attached to this framing or exercise slide.</p>'}
function notes(){const s=slides[index];let note=s.speaker_notes||s.speakerNotes||s.notes||'';if(Array.isArray(note))note=note.join('\n\n');openDialog('Slide '+(index+1)+' · Notes & sources','<h3>Speaker notes</h3><p>'+esc(note||'No additional notes.')+'</p><h3>Sources</h3>'+sourceList(s)+(s.review_note?'<h3>Review note</h3><p>'+esc(s.review_note)+'</p>':'')+'<h3>Research baseline</h3><p>Prepared November 11, 2026 for review. Recheck fast-moving claims and product settings before December 15. This presentation is educational, not legal advice.</p>')}
function menu(){openDialog('Choose a slide','<ol class="slide-menu">'+slides.map((s,i)=>'<li><button data-jump="'+i+'" aria-current="'+(i===index)+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(title(s))+'</button></li>').join('')+'</ol>');$('dialogBody').querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{show(Number(b.dataset.jump));closeDialog()}))}
function help(){openDialog('Present with confidence','<dl class="key-help"><dt>Click right / left</dt><dd>Next / previous slide. Links and controls remain clickable.</dd><dt>→, Space, Enter, Page Down</dt><dd>Next slide</dd><dt>←, Backspace, Page Up</dt><dd>Previous slide</dd><dt>Home / End</dt><dd>First / last slide</dd><dt>N / S / ?</dt><dd>Notes / slide menu / help</dd><dt>Voice button</dt><dd>Optional “Natasha next / last slide please.” Enable the mic explicitly; last means previous.</dd><dt>F</dt><dd>Toggle fullscreen</dd><dt>Escape</dt><dd>Close a dialog or leave fullscreen</dd><dt>Swipe left / right</dt><dd>Next / previous slide on touchscreens</dd></dl><p>Notes are not visible until opened. They are part of this file, so never include private information in them.</p><button id="printSlides" style="padding:12px 18px">Print or save slides as PDF</button>');$('printSlides').addEventListener('click',()=>{closeDialog();window.print()})}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Fullscreen is unavailable here. Use your browser’s fullscreen control.')}}
$('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('menu').addEventListener('click',menu);$('notes').addEventListener('click',notes);$('help').addEventListener('click',help);$('fullscreen').addEventListener('click',fullscreen);$('closeDialog').addEventListener('click',closeDialog);dialog.addEventListener('close',()=>{if(lastFocus&&lastFocus.isConnected)lastFocus.focus()});
deck.addEventListener('click',e=>{if(e.target.closest('button,a,input,textarea,select,label')||window.getSelection().toString())return;move(e.clientX<window.innerWidth/2?-1:1)});
let touchStart=null,suppressClick=false;deck.addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('input,button,a'))touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:true});deck.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){suppressClick=true;move(dx<0?1:-1);setTimeout(()=>suppressClick=false,400)}},{passive:true});deck.addEventListener('click',e=>{if(suppressClick){e.stopImmediatePropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{if(dialog.open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.target.closest('button,a')&&[' ','Enter'].includes(e.key))return;if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}else if(e.key.toLowerCase()==='n')notes();else if(e.key.toLowerCase()==='s')menu();else if(e.key==='?'||e.key.toLowerCase()==='h')help();else if(e.key.toLowerCase()==='f')fullscreen()});
window.addEventListener('popstate',()=>show(hashIndex(),'none'));window.addEventListener('hashchange',()=>show(hashIndex(),'none'));
if($('pennyDay')){const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});function penny(){const day=Number($('pennyDay').value);$('dayNumber').textContent=day;$('dayValue').textContent=money.format(Math.pow(2,day-1)/100);$('sumDay').textContent=day;$('sumValue').textContent=money.format((Math.pow(2,day)-1)/100);$('bars').querySelectorAll('i').forEach((b,k)=>b.classList.toggle('selected',k<day))}$('pennyDay').addEventListener('input',penny);$('resetPenny').addEventListener('click',()=>{$('pennyDay').value=1;penny()});penny()}
// Voice navigation is opt-in for this page visit. No transcript storage or app-side upload.
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
let voiceRecognition=null,voiceEnabled=false,voiceStarting=false,voiceRestartTimer=null,voiceLastCommandAt=0;
function voiceCommand(transcript){
 const text=String(transcript||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
 const match=text.match(/^natasha (next slide|last slide|previous slide|stop listening)(?: please)?$/);
 return match?({'next slide':'next','last slide':'previous','previous slide':'previous','stop listening':'stop'})[match[1]]:null;
}
function voiceButton(state){
 $('voice').textContent=state==='starting'?'Mic starting…':state==='listening'?'Mic on · Stop':'Voice';
 $('voice').setAttribute('aria-pressed',String(voiceEnabled));
 $('voice').setAttribute('title',voiceEnabled?'Stop microphone listening':'Optional voice navigation (microphone is off)');
 $('voiceStatus').textContent=state==='starting'?'Waiting for microphone permission.':state==='listening'?'Voice navigation is listening.':'Voice navigation is off.';
}
function stopVoice(message){
 voiceEnabled=false;voiceStarting=false;clearTimeout(voiceRestartTimer);voiceRestartTimer=null;
 if(voiceRecognition){const old=voiceRecognition;voiceRecognition=null;old.onend=null;try{old.abort()}catch{}}
 voiceButton('off');if(message)toast(message);
}
function startVoice(){
 if(voiceEnabled||!SpeechRecognitionAPI)return;
 if(!window.isSecureContext){toast('Voice needs HTTPS. Use the live presentation URL.');return;}
 voiceEnabled=true;voiceStarting=true;voiceLastCommandAt=0;voiceButton('starting');
 try{
  const recognition=new SpeechRecognitionAPI();voiceRecognition=recognition;
  recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;recognition.maxAlternatives=1;
  recognition.onstart=()=>{if(!voiceEnabled||voiceRecognition!==recognition)return;voiceStarting=false;voiceButton('listening')};
  recognition.onresult=event=>{
   if(!voiceEnabled||voiceRecognition!==recognition)return;
   for(let i=event.resultIndex;i<event.results.length;i++){
    const result=event.results[i];if(!result.isFinal)continue;
    const command=voiceCommand(result[0].transcript);if(!command)continue;
    if(command==='stop'){stopVoice('Microphone off.');return;}
    if(dialog.open)continue;
    const now=Date.now();if(voiceLastCommandAt&&now-voiceLastCommandAt<1200)continue;voiceLastCommandAt=now;
    const before=index;move(command==='next'?1:-1);
    toast(index===before?(command==='next'?'You are on the final slide.':'You are on the first slide.'):'Slide '+(index+1)+' of '+slides.length);
   }
  };
  recognition.onerror=event=>{
   if(voiceRecognition!==recognition)return;
   if(event.error==='no-speech')return;
   const message=event.error==='not-allowed'||event.error==='service-not-allowed'?'Microphone or speech service permission was not granted. Use clicks or arrow keys.':event.error==='audio-capture'?'No usable microphone was found. Check your microphone, or use arrow keys.':event.error==='network'?'The browser speech service is unavailable. Use clicks or arrow keys.':'Voice navigation stopped. Use clicks or arrow keys, or enable Voice again.';
   stopVoice(message);
  };
  recognition.onend=()=>{
   if(!voiceEnabled||voiceRecognition!==recognition)return;
   // Some browsers end after a pause. Continue only within this explicit listening session.
   if(document.hidden){stopVoice();return;}
   voiceButton('starting');voiceRestartTimer=setTimeout(()=>{
    if(!voiceEnabled||voiceRecognition!==recognition)return;
    try{recognition.start()}catch{stopVoice('Voice paused. Click Voice to enable it again.');}
   },300);
  };
  recognition.start();
 }catch{stopVoice('Voice could not start in this browser. Use clicks or arrow keys.');}
}
function voiceHelp(){
 if(voiceEnabled){stopVoice('Microphone off.');return;}
 const supported=!!SpeechRecognitionAPI&&window.isSecureContext;
 openDialog('Optional voice navigation','<p><strong>The microphone is off.</strong> Enable it only when you are ready to present.</p><ul><li>“Natasha next slide please” moves forward.</li><li>“Natasha last slide please” goes back one slide.</li><li>“Natasha previous slide please” also goes back.</li><li>“Natasha stop listening please” turns listening off.</li></ul><h3>Before enabling</h3><p>While enabled, your browser listens continuously, not just after the word Natasha. It may send surrounding audio to its speech-recognition provider, such as Google in Chrome. This presentation does not record or save audio or transcripts; your browser provider’s processing and retention policies still apply. Avoid confidential conversations while listening is on.</p><p>Click the button below, then allow microphone access in your browser if prompted. Listening stops when you click “Mic on · Stop,” leave this tab, or reload. Returning to the tab will not turn it back on.</p><p>Browser support varies. Some browsers require an internet connection or may stop listening. Try a current desktop Chrome browser and rehearse with your presentation microphone. Clicks and arrow keys always remain available. There is a visual response, not a spoken reply.</p><p><a href="https://developer.mozilla.org/en-US/docs/Web/API/SpeechRecognition" target="_blank" rel="noopener noreferrer">Browser speech-recognition details</a></p>'+(supported?'<button id="startVoice" class="voice-start">Enable microphone & voice navigation</button>':'<p><strong>Voice recognition is unavailable in this browser or context.</strong> Open the HTTPS presentation in a supported browser, or use the existing controls.</p>'));
 if(supported)$('startVoice').addEventListener('click',()=>{closeDialog();startVoice()});
}
$('voice').addEventListener('click',voiceHelp);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&voiceEnabled)stopVoice('Microphone off while this tab is hidden.');});
window.addEventListener('pagehide',()=>stopVoice());
voiceButton('off');
