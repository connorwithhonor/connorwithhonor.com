<!DOCTYPE html>

<head>

<title>Studio Wall · Command</title>
<!--
  STUDIO WALL, COMBINED LANE — connorwithhonor.com/command/?panel=1
  Ported 2026-09-03 onto the shared engine at /wall/wall.js + /wall/wall.css, the same
  two files behind santaclaritaopenhouses.com/1 through /4. Six walls, one system.

  WHY THIS ONE IS ALLOWED TO ARGUE BOTH LANES, when none of the other five are: it is
  not standing behind a pitch for a single business. It is the operator's own wall, the
  one that says there are two businesses and one person running both. Every other wall
  keeps its lanes clean on purpose.

  IT RUNS RED, same as santaclaritaopenhouses.com/3. Do not put those two on adjacent
  monitors, or use ?panel= to offset them so they never sit on the same slide.

  ?panel=N offsets the rotation. ?speed=20 seconds per slide (default 16). F fullscreens.
-->
<link rel="stylesheet" href="/wall/wall.css">
<style>:root{--bg:#0a0405;--ink:#ffeae6;--dim:#a06661;--ac:#ff2d4a;--ac2:#ff8a6e}</style>
</head>
<body>
<canvas id="motif"></canvas>
<div class="vig"></div><div class="scan"></div>
<div class="ret r1"></div><div class="ret r2"></div><div class="ret r3"></div><div class="ret r4"></div>
<div class="bar" id="bar"></div>
<div class="brand" id="brand"></div>
<div class="stage"><div class="slide on" id="slide"></div></div>
<div class="band"><div class="tick" id="tick"></div></div>
<script>
window.WALL = {
  theme : 'red',
  // The one wall that argues both lanes, so one bare number is ambiguous by
  // construction: a viewer cannot tell which business it reaches. Both, each labelled.
  brand : '<b>Connor MacIvor</b> &nbsp;&middot;&nbsp; AI 661-476-2217 &nbsp;&middot;&nbsp; REAL ESTATE 661-400-1720',
  live  : 'cwh',
  // NO INVENTED NUMBERS. Every figure here is one already verified and dated on another
  // wall, restated. If this wall ever needs its own live figures, wire an API the way
  // wall 3 does. Do not guess one in to fill a slide.
  slides: [
    { t:'stack', lines:[{text:'Two businesses.'},{text:'One operator.'},{text:'No excuses.',hi:1}] },
    { t:'rows', kick:'System status', rows:[
        ['Automations, one machine','24',1],
        ['Machines in the workshop','FOUR',0],
        ['Sides of your deal I take','ONE',0]],
      // 24 verified on Vincent 2026-09-03. The old slide here read "19 / Automations
      // running right now", which was a month stale AND overclaimed: 8 of the 24 were
      // erroring the day they were counted. Registered and enabled is the honest frame.
      sub:'Registered and enabled. Nobody starts them in the morning.' },
    { t:'fig', kick:'Real estate', fig:'ONE SIDE', lab:"Seller's Only Agent&trade;",
      sub:'Sellers only. Never both sides. Buyers referred out to a dedicated agent.' },
    { t:'line', kick:'The build', text:'Built here. <em>Not resold</em>, not a course, not a pilot.' },
    { t:'fig', kick:'Standing watch', fig:'24/7', lab:'The system does not take lunch',
      sub:'It answers while the office is dark, and reports what happened.' },
    { t:'stack', lines:[{text:'Recorded'},{text:'closings.'},{text:'Not estimates.',hi:1}],
      sub:'Every real-estate number he quotes comes from what actually closed.' }
  ],
  ticker: [
    '<b>Connor MacIvor</b> &middot; two businesses, one operator',
    'AI systems built in Santa Clarita &middot; <b>661-476-2217</b>',
    "Seller's Only Agent&trade; &middot; sellers only, never both sides &middot; <b>661-400-1720</b>",
    'CalDRE #01238257 &middot; Sync Brokerage &middot; <b>24 automations on one machine</b>'
  ]
};
</script><script src="/wall/wall.js"></script></body></html>
