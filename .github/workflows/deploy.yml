name: Deploy to Cloudflare Pages

# 2026-06-22: connorwithhonor.com serves from Cloudflare Pages (project
# `connorwithhonor`, account 8d19fd09). A push to main stages the publishable
# files (excluding internal/host files), runs an anti-wipe guard, then deploys
# via wrangler using the scoped CLOUDFLARE_API_TOKEN secret (Cloudflare Pages:Edit).
# Local equivalent: ./deploy-cf.sh

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a deploy mid-flight

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Stage publishable files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='scripts' \
            --exclude='CLAUDE.md' --exclude='claude.md' --exclude='README*' \
            --exclude='netlify.toml' --exclude='deploy-cf.sh' \
            --exclude='.gitattributes' --exclude='.gitignore' \
            --exclude='_site' \
            ./ _site/

      - name: Anti-wipe guard
        run: |
          # Lessons from the 2026-05-21 5-site wipe: never ship a near-empty
          # or non-HTML homepage to production.
          count=$(find _site -type f | wc -l)
          echo "Staged $count files."
          if [ "$count" -lt 20 ]; then
            echo "::error::Only $count files staged — refusing to deploy."
            exit 1
          fi
          if [ ! -f _site/index.html ] || [ "$(wc -c < _site/index.html)" -lt 500 ]; then
            echo "::error::index.html missing or under 500 bytes."
            exit 1
          fi
          if ! head -c 200 _site/index.html | grep -qiE '<(!doctype|html)'; then
            echo "::error::index.html does not look like HTML."
            exit 1
          fi
          echo "Guard passed."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8d19fd09c66903840c347da43306673e
          command: pages deploy _site --project-name=connorwithhonor --branch=main

      - name: Verify live
        run: |
          sleep 8
          for url in "https://connorwithhonor.com/" "https://connorwithhonor.com/blog/"; do
            status=$(curl -sIo /dev/null -w "%{http_code}" "$url")
            if ! echo "$status" | grep -qE '^(200|301|302|304)$'; then
              echo "::error::Post-deploy check failed: $url -> $status"
              exit 1
            fi
            echo "  OK $url -> $status"
          done
