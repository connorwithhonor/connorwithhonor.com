# connorwithhonor.com - Netlify build config
# Source of truth: this repo. Deploys triggered on push to main.
# Snapshot-API uploads are deprecated. See SITE-REGISTRY.txt + connor-own-sites-git-canonical.md

[build]
  publish = "."

# Granular processing config. We need HTML processing ON for Netlify Forms
# detection to work (data-netlify="true" forms get registered during the post-
# processing step). The past favicon-duplication issue was caused by manual-
# deploy sessions, not by Netlify's HTML processor. With git-canonical auto-
# deploy the source HTML is trusted.
#
# We explicitly DISABLE the asset bundling/minification options that aren't
# needed since the site is pre-optimized.

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

# Don't publish project-internal docs even if they get committed
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/README*"
  to = "/404.html"
  status = 404
